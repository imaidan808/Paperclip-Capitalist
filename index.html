      <p>Paperclip Capitalist is a free 90-day entrepreneurship game for university courses. Everyone starts with one paperclip and $0 and trades up through sixteen districts.</p>
      <p>It runs entirely in your browser, so it needs JavaScript: turn it on for this site and reload the page. Nothing is sent to a server unless you join a classroom room with a code from your instructor; then the room sees your alias, a random Founder ID and your game numbers.</p>
