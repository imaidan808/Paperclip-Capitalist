name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci --prefix server
      - name: Run the tests
        shell: bash
        run: |
          npm test 2>&1 | tee test.log
          # A test marked todo is a known fault. It does not change the exit code, so the site would deploy with it: stop here instead.
          if grep -Eq 'todo [1-9][0-9]*$' test.log; then echo 'A test is marked todo, which means a known fault. Fix it before deploying.'; exit 1; fi
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: actions/configure-pages@v6
      - name: Stage the site
        # scripts/stage.mjs builds exactly what is served (the page with its module preload lines, 404.html, robots.txt, sitemap.xml, llms.txt, assets/, css/, and the modules js/main.js imports)
        # and checks it hangs together before it exits 0. Nothing else goes up: no tests, server, docs, scripts or hidden files.
        run: node scripts/stage.mjs _site --lastmod "$(git log -1 --format=%cs)"
      - uses: actions/upload-pages-artifact@v5
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v5
