<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paperclip Capitalist: share image (1200 x 630)</title>
<!-- The scene assets/share.png is rendered from (node assets/src/render.mjs). Static on purpose: no script, no request, only the game's own look:
     the dark ground and 24px grid of css/styles.css, the gold of the paperclip mark, the hard offset shadow of its headings, and the sixteen districts
     as a staircase of plates in each district's own two colors (js/data/tier1..4.js), climbing from the Scrap Yard to the Global Exchange. -->
<style>
  :root { --bg: #0d1117; --ink: #e8eef6; --mute: #a3b3c9; --gold: #ffc247; --line: #34445c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--bg); }
  body { position: relative; color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 24px 24px; }
  .frame { position: absolute; inset: 18px; border: 2px solid var(--line); }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .kicker { position: absolute; left: 66px; top: 50px; margin: 0; font-size: 22px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
  h1 { position: absolute; left: 62px; top: 82px; margin: 0; font-size: 108px; line-height: 1.02; letter-spacing: .01em; color: var(--gold); text-shadow: 6px 6px 0 #000; font-weight: 800; }
  .tag { position: absolute; left: 66px; top: 316px; margin: 0; font-size: 46px; line-height: 1.1; font-weight: 700; color: var(--ink); text-shadow: 3px 3px 0 #000; }
  .facts { position: absolute; left: 66px; top: 378px; margin: 0; font-size: 22px; color: var(--mute); }
  .facts b { color: var(--gold); font-weight: 700; }
  svg { position: absolute; left: 0; top: 0; }
</style>
</head>
